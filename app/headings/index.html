<html>
   <head>
      <title>Headings</title>
   </head>
   <body>
      <!-- Headings are used to define the structure and hierarchy of content on a webpage -->
      <!-- The <h1> tag represents the most important heading, while <h6> represents the least important -->
      <h1>This is a heading</h1>
      <h2>This is a subheading</h2>
      <h3>This is a smaller subheading</h3>
      <h4>This is an even smaller subheading</h4>
      <h5>This is a very small subheading</h5>
      <h6>This is the smallest subheading</h6>
   </body>
</html>
