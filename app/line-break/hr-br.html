<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Hr Tag</title>
   </head>
   <body>
      <header>
         <h1>Horizontal Line</h1>
      </header>

      <main>
         <section>
            <h2>Horizontal Line Example</h2>
            <p>
               This is an example of a
               <br />
               horizontal line using the &lt;hr&gt; tag:
            </p>
            <hr />
            <p>
               The horizontal line above separates the
               <br />
               content.
            </p>
         </section>
      </main>

      <footer>
         <p>&copy; 2024 Horizontal Line Example</p>
      </footer>
   </body>
</html>
