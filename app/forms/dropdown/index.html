<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Select and Options</title>
   </head>
   <body>
      <!-- EXAMPLE SELECT AND OPTIONS -->
      <label for="dropdown">Dropdown:</label>
      <select id="dropdown" name="values">
         <!-- value="" will send to the server -->
         <option value="option1">Option 1</option>
         <option value="option2">Option 2</option>
         <option value="option3">Option 3</option>
      </select>

      <!-- EXAMPLE 2 -->
      <label for="journal-category">Journal Category:</label>
      <select id="journal-category" name="journal-category">
         <option value="tech">Technology</option>
         <option value="science">Science</option>
         <option value="arts">Arts</option>
      </select>
   </body>
</html>
