<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Text Area</title>
   </head>
   <body>
      <!-- EXAMPLE TEXT AREA -->
      <label for="message">Message:</label>
      <textarea
         id="message"
         name="message"
         placeholder="Enter your message"
         rows="5"
         cols="40"
      ></textarea>
   </body>
</html>
